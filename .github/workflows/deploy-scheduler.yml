name: Deploy FX Terminal Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/scheduler/**'
      - 'worker/automation-policy.ts'
      - '.github/workflows/deploy-scheduler.yml'

permissions:
  contents: read

jobs:
  deploy-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run scheduler tests
        run: node --test tests/automation.test.mjs

      - name: Deploy scheduler Worker
        run: npx wrangler@4.92.0 deploy --config worker/scheduler/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
