name: Deploy FX Terminal Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/scheduler/**'
      - 'worker/automation-policy.ts'
      - '.github/workflows/deploy-scheduler.yml'

permissions:
  contents: read

jobs:
  deploy-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run scheduler tests
        run: node --test tests/automation.test.mjs

      - name: Normalize Cloudflare token format
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -e 's/^Bearer[[:space:]]*//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          token="${token#Bearer }"
          if [ -z "$token" ]; then echo 'Cloudflare token secret is empty.'; exit 1; fi
          if printf '%s' "$token" | grep -q '[[:space:]]'; then echo 'Cloudflare token contains whitespace after normalization.'; exit 1; fi
          printf '%s' "$token" | awk '{ if (length($0) < 20) { print "Cloudflare token is unexpectedly short."; exit 1 } }'
          verify="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          printf '%s' "$verify" | grep -q '"success":true' || { echo 'Cloudflare token verification failed; replace the GitHub secret with the raw API token value, not a label or permission description.'; exit 1; }
          echo 'Cloudflare token format and API verification passed.'
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Deploy scheduler Worker
        run: npx wrangler@4.92.0 deploy --config worker/scheduler/wrangler.jsonc
